<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#143d2a">
<title>Palavra, Mesa e Missão — Leitor móvel</title>
<style>
:root{
  --green:#143d2a;--green2:#0b2e20;--gold:#b58a2a;
  --paper:#fffdf8;--text:#20251f;--line:#d8cfb8;
  --bar-h:72px
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#f5f0e4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{overflow:hidden;color:var(--text)}
header{
  height:52px;display:flex;align-items:center;justify-content:center;
  padding:0 52px;background:linear-gradient(145deg,var(--green2),#18563b);
  color:#fff;border-bottom:3px solid var(--gold);position:relative;z-index:4
}
header strong{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{
  position:absolute;right:8px;top:7px;width:38px;height:38px;border:1px solid #ffffff55;
  background:#ffffff14;color:#fff;border-radius:50%;font-size:18px
}
#reader{
  display:block;border:0;width:100%;height:calc(100dvh - 52px - var(--bar-h) - env(safe-area-inset-bottom));
  background:var(--paper)
}
.bottom-nav{
  height:calc(var(--bar-h) + env(safe-area-inset-bottom));
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:rgba(255,253,248,.97);border-top:1px solid var(--line);
  box-shadow:0 -5px 22px #0002;backdrop-filter:blur(12px)
}
.nav-btn{
  border:0;background:transparent;color:var(--green);border-radius:12px;
  font-weight:700;font-size:.68rem;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;min-width:0
}
.nav-btn .ico{font-size:1.28rem;line-height:1}
.nav-btn:active{background:#eee6d3}
.drawer,.export-sheet{
  position:fixed;z-index:20;inset:0;background:#0007;display:none
}
.drawer.open,.export-sheet.open{display:block}
.panel{
  position:absolute;left:0;top:0;bottom:0;width:min(88vw,390px);
  background:var(--paper);padding:16px;overflow:auto;
  box-shadow:8px 0 28px #0005
}
.sheet-panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--paper);
  border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px #0005
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h2,.sheet-panel h2{margin:.2rem 0 1rem;color:var(--green);font-size:1.25rem}
.close{
  border:1px solid var(--line);background:#fff;color:var(--green);
  width:40px;height:40px;border-radius:50%;font-size:20px
}
#toc a{
  display:block;color:var(--green);text-decoration:none;padding:.78rem .25rem;
  border-bottom:1px solid var(--line);font-weight:700
}
#toc a.sub{padding-left:1rem;font-weight:600;font-size:.92rem;color:#6f5318}
.action{
  display:block;width:100%;padding:13px;margin:8px 0;border:1px solid var(--line);
  border-radius:14px;background:#fffdf8;color:var(--green);font-weight:800;text-align:left
}
.notice{
  position:fixed;left:50%;bottom:calc(var(--bar-h) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:#143d2a;color:#fff;padding:10px 15px;
  border-radius:999px;font-size:.85rem;z-index:30;display:none;white-space:nowrap
}
@media(min-width:800px){
  body{max-width:820px;margin:auto;box-shadow:0 0 35px #0002}
}
</style>
</head>
<body>
<header>
  <strong>Volume 4 — Vinde às Águas</strong>
  <button id="reload" aria-label="Recarregar">↻</button>
</header>

<iframe id="reader" src="Index V4-1.html" title="Caderno Palavra, Mesa e Missão"></iframe>

<nav class="bottom-nav" aria-label="Navegação móvel">
  <button class="nav-btn" id="sumario"><span class="ico">☰</span><span>Sumário</span></button>
  <button class="nav-btn" id="inicio"><span class="ico">⌂</span><span>Início</span></button>
  <button class="nav-btn" id="continuar"><span class="ico">▶</span><span>Continuar</span></button>
  <button class="nav-btn" id="compartilhar"><span class="ico">↗</span><span>Compartilhar</span></button>
  <button class="nav-btn" id="exportar"><span class="ico">⇩</span><span>Exportar</span></button>
</nav>

<div class="drawer" id="drawer">
  <div class="panel">
    <div class="panel-head">
      <h2>Sumário</h2>
      <button class="close" data-close="drawer">×</button>
    </div>
    <div id="toc"><p>Carregando seções…</p></div>
  </div>
</div>

<div class="export-sheet" id="exportSheet">
  <div class="sheet-panel">
    <div class="panel-head">
      <h2>Exportar conteúdo</h2>
      <button class="close" data-close="exportSheet">×</button>
    </div>
    <button class="action" id="printAll">🖨️ Salvar o caderno completo em PDF</button>
    <button class="action" id="printSection">📄 Salvar a seção atual em PDF</button>
    <button class="action" id="copySelection">📋 Copiar trecho selecionado</button>
  </div>
</div>

<div class="notice" id="notice"></div>

<script>
const frame = document.getElementById('reader');
const drawer = document.getElementById('drawer');
const sheet = document.getElementById('exportSheet');
const toc = document.getElementById('toc');
const STORAGE_KEY = 'pmm-volume4-reading-position';
let frameDoc = null, frameWin = null, currentSectionId = '';

function toast(msg){
  const el=document.getElementById('notice');
  el.textContent=msg; el.style.display='block';
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.style.display='none',2200);
}
function safeAccess(){
  try{
    frameDoc=frame.contentDocument || frame.contentWindow.document;
    frameWin=frame.contentWindow;
    return !!frameDoc;
  }catch(e){
    toast('Publique os dois arquivos na mesma pasta para ativar todos os recursos.');
    return false;
  }
}
function slug(text,i){
  return 'sec-'+(text||'parte').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+i;
}
function buildToc(){
  if(!safeAccess()) return;
  const headings=[...frameDoc.querySelectorAll('h2,h3')];
  toc.innerHTML='';
  if(!headings.length){toc.innerHTML='<p>Não foram encontradas seções.</p>';return;}
  headings.forEach((h,i)=>{
    if(!h.id) h.id=slug(h.textContent,i);
    const a=document.createElement('a');
    a.href='#'; a.textContent=h.textContent.trim();
    if(h.tagName==='H3') a.className='sub';
    a.onclick=(ev)=>{
      ev.preventDefault(); drawer.classList.remove('open');
      h.scrollIntoView({behavior:'smooth',block:'start'});
      currentSectionId=h.id; savePosition();
    };
    toc.appendChild(a);
  });
}
function savePosition(){
  if(!safeAccess()) return;
  const headings=[...frameDoc.querySelectorAll('h2,h3')];
  let active='';
  for(const h of headings){
    if(h.getBoundingClientRect().top<=140) active=h.id;
  }
  currentSectionId=active||currentSectionId;
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
    y:frameWin.scrollY||0, section:currentSectionId, at:Date.now()
  }));
}
function restorePosition(){
  if(!safeAccess()) return;
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(!saved){toast('Ainda não há uma posição de leitura salva.');return;}
  if(saved.section){
    const el=frameDoc.getElementById(saved.section);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});toast('Leitura retomada.');return;}
  }
  frameWin.scrollTo({top:saved.y||0,behavior:'smooth'});
  toast('Leitura retomada.');
}
function startAutoSave(){
  if(!safeAccess()) return;
  let timer;
  frameWin.addEventListener('scroll',()=>{
    clearTimeout(timer);timer=setTimeout(savePosition,350);
  },{passive:true});
  setInterval(savePosition,12000);
}
frame.addEventListener('load',()=>{
  if(!safeAccess())return;
  buildToc(); startAutoSave();
  setTimeout(()=>{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved && confirm('Deseja continuar de onde parou?')) restorePosition();
  },500);
});

document.getElementById('sumario').onclick=()=>drawer.classList.add('open');
document.getElementById('inicio').onclick=()=>{
  if(safeAccess()) frameWin.scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('continuar').onclick=restorePosition;
document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();

document.getElementById('compartilhar').onclick=async()=>{
  const data={
    title:'Volume 4 — Vinde às Águas',
    text:'Leia o caderno Palavra, Mesa e Missão — Volume 4: Vinde às Águas.',
    url:location.href
  };
  try{
    if(navigator.share) await navigator.share(data);
    else{
      await navigator.clipboard.writeText(location.href);
      toast('Link copiado para compartilhar.');
    }
  }catch(e){}
};

document.getElementById('exportar').onclick=()=>sheet.classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{
  document.getElementById(b.dataset.close).classList.remove('open');
});
drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};

document.getElementById('printAll').onclick=()=>{
  sheet.classList.remove('open');
  if(safeAccess()) frameWin.print();
};
document.getElementById('printSection').onclick=()=>{
  sheet.classList.remove('open');
  if(!safeAccess())return;
  const el=currentSectionId && frameDoc.getElementById(currentSectionId);
  if(el) el.scrollIntoView({behavior:'auto',block:'start'});
  toast('Na tela de impressão, escolha “Salvar como PDF”.');
  setTimeout(()=>frameWin.print(),500);
};
document.getElementById('copySelection').onclick=async()=>{
  sheet.classList.remove('open');
  if(!safeAccess())return;
  const text=frameWin.getSelection().toString().trim();
  if(!text){toast('Selecione primeiro um trecho dentro da leitura.');return;}
  try{await navigator.clipboard.writeText(text);toast('Trecho copiado.');}
  catch(e){toast('Não foi possível copiar o trecho.');}
};

window.addEventListener('beforeunload',savePosition);
</script>
</body>
</html>
